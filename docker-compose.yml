services:
  postgres:
    image: postgres:16-alpine
    container_name: rototuna-postgres

    environment:
      POSTGRES_DB: rototuna_alumni
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rototuna_alumni"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: rototuna-backend

    environment:
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@postgres:5432/rototuna_alumni"
      SECRET_KEY: "change-this-development-secret"
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      CORS_ORIGINS: "http://localhost:5173"

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: rototuna-frontend

    environment:
      VITE_API_URL: "http://localhost:8000/api"

    ports:
      - "5173:5173"

    depends_on:
      - backend

volumes:
  postgres_data: